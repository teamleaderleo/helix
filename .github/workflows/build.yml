name: Build
on:
  pull_request:
  push:
    branches:
      - master
  merge_group:
  schedule:
    - cron: "00 01 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MSRV: "1.90"
  # This key can be changed to bust the cache of tree-sitter grammars.
  GRAMMAR_CACHE_VERSION: ""

jobs:
  apply-round-004-replay-fix:
    name: Apply tested replay fix
    if: github.repository == 'teamleaderleo/helix' && github.event_name == 'pull_request' && github.head_ref == 'fix/final-view-replay-loops'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RUST_BACKTRACE: 1
      HELIX_LOG_LEVEL: info
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v7
        with:
          ref: fix/final-view-replay-loops
          fetch-depth: 0

      - name: Apply terminal checks to replay loops
        shell: python
        run: |
          from pathlib import Path

          commands = Path("helix-term/src/commands.rs")
          text = commands.read_text()

          configured_old = '''                    for key in keys.into_iter() {
                        compositor.handle_event(&compositor::Event::Key(key), cx);
                    }
                    cx.editor.macro_replaying.pop();'''
          configured_new = '''                    for key in keys.into_iter() {
                        compositor.handle_event(&compositor::Event::Key(key), cx);
                        if cx.editor.should_close() {
                            break;
                        }
                    }
                    cx.editor.macro_replaying.pop();'''
          if configured_old in text:
              text = text.replace(configured_old, configured_new, 1)
          elif configured_new not in text:
              raise SystemExit("configured macro loop did not match expected source")

          recorded_old = '''        for _ in 0..count {
            for &key in keys.iter() {
                compositor.handle_event(&compositor::Event::Key(key), cx);
            }
        }
        // The macro under replay is cleared at the end of the callback'''
          recorded_new = '''        'replay: for _ in 0..count {
            for &key in keys.iter() {
                compositor.handle_event(&compositor::Event::Key(key), cx);
                if cx.editor.should_close() {
                    break 'replay;
                }
            }
        }
        // The macro under replay is cleared at the end of the callback'''
          if recorded_old in text:
              text = text.replace(recorded_old, recorded_new, 1)
          elif recorded_new not in text:
              raise SystemExit("recorded macro loop did not match expected source")

          commands.write_text(text)

          editor = Path("helix-term/src/ui/editor.rs")
          text = editor.read_text()

          repeat_header_old = '''                for _ in 0..cxt.editor.count.map_or(1, NonZeroUsize::into) {
                    // first execute whatever put us into insert mode
                    self.last_insert.0.execute(cxt);
                    let mut last_savepoint = None;'''
          repeat_header_new = '''                'repeat: for _ in 0..cxt.editor.count.map_or(1, NonZeroUsize::into) {
                    // first execute whatever put us into insert mode
                    self.last_insert.0.execute(cxt);
                    if cxt.editor.should_close() {
                        break 'repeat;
                    }
                    let mut last_savepoint = None;'''
          if repeat_header_old in text:
              text = text.replace(repeat_header_old, repeat_header_new, 1)
          elif repeat_header_new not in text:
              raise SystemExit("dot-repeat header did not match expected source")

          repeat_tail_old = '''                            InsertEvent::RequestCompletion => {
                                let (view, doc) = current!(cxt.editor);
                                last_request_savepoint = Some(doc.savepoint(view));
                            }
                        }
                    }
                }
                cxt.editor.count = None;'''
          repeat_tail_new = '''                            InsertEvent::RequestCompletion => {
                                let (view, doc) = current!(cxt.editor);
                                last_request_savepoint = Some(doc.savepoint(view));
                            }
                        }
                        if cxt.editor.should_close() {
                            break 'repeat;
                        }
                    }
                }
                cxt.editor.count = None;'''
          if repeat_tail_old in text:
              text = text.replace(repeat_tail_old, repeat_tail_new, 1)
          elif repeat_tail_new not in text:
              raise SystemExit("dot-repeat tail did not match expected source")

          editor.write_text(text)

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: round-004-replay-fix
          cache-grammars: 'true'
          grammar-cache-version: ${{ env.GRAMMAR_CACHE_VERSION }}

      - name: Format
        run: cargo fmt --all

      - name: Run focused replay tests
        run: cargo integration-test command_sequences -- --nocapture

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Commit tested source changes
        shell: bash
        run: |
          if git diff --quiet -- helix-term/src/commands.rs helix-term/src/ui/editor.rs; then
            echo "Source already patched"
            exit 0
          fi
          git config user.name "teamleaderleo"
          git config user.email "13091533+teamleaderleo@users.noreply.github.com"
          git add helix-term/src/commands.rs helix-term/src/ui/editor.rs
          git commit -m "fix: stop replay loops after closing final view"
          git push origin HEAD:fix/final-view-replay-loops

  check:
    name: Check (msrv)
    runs-on: ubuntu-latest
    if: github.repository == 'helix-editor/helix' || github.event_name != 'schedule'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: build

      - name: Run cargo check
        run: cargo check

  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    if: github.repository == 'helix-editor/helix' || github.event_name != 'schedule'
    timeout-minutes: 30
    env:
      RUST_BACKTRACE: 1
      HELIX_LOG_LEVEL: info
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: build
          cache-grammars: 'true'
          grammar-cache-version: ${{ env.GRAMMAR_CACHE_VERSION }}

      - name: Run cargo test
        run: cargo test --workspace

      - name: Run cargo integration-test
        run: cargo integration-test

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]

  lints:
    name: Lints
    runs-on: ubuntu-latest
    if: github.repository == 'helix-editor/helix' || github.event_name != 'schedule'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          components: rustfmt, clippy
          cache-key: build

      - name: Run cargo fmt
        run: cargo fmt --all --check

      - name: Run cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run cargo doc
        run: cargo doc --no-deps --workspace --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings

  docs:
    name: Grammar Lint
    runs-on: ubuntu-latest
    if: github.repository == 'helix-editor/helix' || github.event_name != 'schedule'
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7

      - uses: ./.github/actions/rust-setup
        with:
          toolchain: ${{ env.MSRV }}
          cache-key: build
          cache-grammars: 'true'
          grammar-cache-version: ${{ env.GRAMMAR_CACHE_VERSION }}

      - name: Validate queries
        if: always()
        run: cargo xtask query-check

      - name: Validate indents
        if: always()
        run: cargo xtask indent-check

      - name: Validate highlights
        if: always()
        run: cargo xtask highlight-check

      - name: Validate themes
        if: always()
        run: cargo xtask theme-check

      - name: Generate docs
        if: always()
        run: cargo xtask docgen

      - name: Check uncommitted documentation changes
        if: always()
        run: |
          git diff
          git diff-files --quiet \
            || (echo "Run 'cargo xtask docgen', commit the changes and push again" \
            && exit 1)
