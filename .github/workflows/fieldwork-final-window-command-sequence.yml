name: Fieldwork final-view replay loops

on:
  pull_request:
    branches:
      - execution-base/16136-replay
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Confirm replay characterizations distinguish current behavior
        shell: bash
        run: |
          set +e
          cargo integration-test command_sequences -- --nocapture
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Expected the final-view replay characterizations to fail on the unmodified source"
            exit 1
          fi

  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Apply bounded replay-loop candidate
        run: |
          python3 - <<'PY'
          from pathlib import Path

          commands = Path('helix-term/src/commands.rs')
          source = commands.read_text(encoding='utf-8')

          configured_old = '''                    for key in keys.into_iter() {
                        compositor.handle_event(&compositor::Event::Key(key), cx);
                    }
                    cx.editor.macro_replaying.pop();'''
          configured_new = '''                    for key in keys.into_iter() {
                        compositor.handle_event(&compositor::Event::Key(key), cx);
                        if cx.editor.should_close() {
                            break;
                        }
                    }
                    cx.editor.macro_replaying.pop();'''
          if source.count(configured_old) != 1:
              raise SystemExit(f'expected one configured macro loop, found {source.count(configured_old)}')
          source = source.replace(configured_old, configured_new, 1)

          recorded_old = '''        for _ in 0..count {
            for &key in keys.iter() {
                compositor.handle_event(&compositor::Event::Key(key), cx);
            }
        }
        // The macro under replay is cleared at the end of the callback'''
          recorded_new = '''        'replay: for _ in 0..count {
            for &key in keys.iter() {
                compositor.handle_event(&compositor::Event::Key(key), cx);
                if cx.editor.should_close() {
                    break 'replay;
                }
            }
        }
        // The macro under replay is cleared at the end of the callback'''
          if source.count(recorded_old) != 1:
              raise SystemExit(f'expected one recorded macro loop, found {source.count(recorded_old)}')
          source = source.replace(recorded_old, recorded_new, 1)
          commands.write_text(source, encoding='utf-8')

          editor = Path('helix-term/src/ui/editor.rs')
          source = editor.read_text(encoding='utf-8')

          repeat_header_old = '''                for _ in 0..cxt.editor.count.map_or(1, NonZeroUsize::into) {
                    // first execute whatever put us into insert mode
                    self.last_insert.0.execute(cxt);
                    let mut last_savepoint = None;'''
          repeat_header_new = '''                'repeat: for _ in 0..cxt.editor.count.map_or(1, NonZeroUsize::into) {
                    // first execute whatever put us into insert mode
                    self.last_insert.0.execute(cxt);
                    if cxt.editor.should_close() {
                        break 'repeat;
                    }
                    let mut last_savepoint = None;'''
          if source.count(repeat_header_old) != 1:
              raise SystemExit(f'expected one dot-repeat header, found {source.count(repeat_header_old)}')
          source = source.replace(repeat_header_old, repeat_header_new, 1)

          repeat_tail_old = '''                            InsertEvent::RequestCompletion => {
                                let (view, doc) = current!(cxt.editor);
                                last_request_savepoint = Some(doc.savepoint(view));
                            }
                        }
                    }
                }
                cxt.editor.count = None;'''
          repeat_tail_new = '''                            InsertEvent::RequestCompletion => {
                                let (view, doc) = current!(cxt.editor);
                                last_request_savepoint = Some(doc.savepoint(view));
                            }
                        }
                        if cxt.editor.should_close() {
                            break 'repeat;
                        }
                    }
                }
                cxt.editor.count = None;'''
          if source.count(repeat_tail_old) != 1:
              raise SystemExit(f'expected one dot-repeat tail, found {source.count(repeat_tail_old)}')
          source = source.replace(repeat_tail_old, repeat_tail_new, 1)
          editor.write_text(source, encoding='utf-8')
          PY
      - name: Format candidate
        run: cargo fmt --all
      - name: Run focused replay matrix
        run: cargo integration-test command_sequences -- --nocapture
      - name: Run workspace tests
        run: cargo test --workspace
      - name: Check candidate fence
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' helix-term/src/commands.rs helix-term/src/ui/editor.rs | sort)"
